name: NTP Fallback Verifier

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at 00:00 UTC
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh all fallback IPs with fresh upstream candidates'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  verify-ntp-ips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit and Verify Fallback NTP IPs
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: |
          set -euo pipefail
          CONF_FILE="docker/ntp-servers.conf"
          [ ! -f "$CONF_FILE" ] && exit 0

          TEMP_FILE=$(mktemp)
          echo "# Multi-Provider Anycast NTP Fallback IPs for Raspberry Pi / RTC Cold-Boot Recovery" > "$TEMP_FILE"
          echo "# Automatically maintained and verified weekly by .github/workflows/ntp-verifier.yml" >> "$TEMP_FILE"
          echo "# Format: PROVIDER|HOSTNAME|IPV4" >> "$TEMP_FILE"

          while IFS='|' read -r provider host current_ip || [ -n "$provider" ]; do
            [[ "$provider" =~ ^# ]] || [ -z "$provider" ] && continue

            # Determine query targets (include regional atomic clock endpoints for NIST)
            query_hosts="$host"
            if [ "$provider" = "NIST" ]; then
              query_hosts="time.nist.gov time-a-g.nist.gov time-a-b.nist.gov"
            fi

            # Fetch active IP pool (5 queries to capture all round-robin Anycast nodes)
            resolved_pool=""
            for qh in $query_hosts; do
              ips=$(for _ in {1..5}; do dig +short "$qh" A 2>/dev/null || true; done | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | grep -vE '^(0\.|127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|169\.254\.)' || true)
              resolved_pool=$(printf "%s\n%s" "$resolved_pool" "$ips")
            done
            resolved_pool=$(echo "$resolved_pool" | sed '/^[[:space:]]*$/d' | sort -u)

            # Anti-Flap Guard: If current IP is active in provider's pool and not forced, preserve it
            if [ "$FORCE_REFRESH" != "true" ] && [ -n "$current_ip" ] && echo "$resolved_pool" | grep -qx "$current_ip"; then
              echo "✅ $provider ($host): $current_ip active in pool"
              echo "${provider}|${host}|${current_ip}" >> "$TEMP_FILE"
            else
              # IP is missing from pool or force refresh requested: pick candidate not already assigned in TEMP_FILE
              new_ip=""
              for cand in $(echo "$resolved_pool" | sort -V); do
                if ! grep -q "|${cand}$" "$TEMP_FILE" 2>/dev/null; then
                  new_ip="$cand"
                  break
                fi
              done

              if [ -n "$new_ip" ]; then
                echo "⚡ $provider ($host): updated $current_ip -> $new_ip"
                echo "${provider}|${host}|${new_ip}" >> "$TEMP_FILE"
              else
                echo "⚠️ $provider ($host): preserving $current_ip (no alternate candidates in pool)"
                echo "${provider}|${host}|${current_ip}" >> "$TEMP_FILE"
              fi
            fi
          done < "$CONF_FILE"

          mv "$TEMP_FILE" "$CONF_FILE"

          if ! git diff --quiet "$CONF_FILE"; then
            echo "NTP fallback IPs updated from upstream DNS."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git pull --rebase origin master || true
            git add "$CONF_FILE"
            git commit -m "chore(ntp): update Anycast fallback NTP server IPs"
            git push origin master
          else
            echo "All fallback NTP IPs verified active in pools. Zero changes needed."
          fi
