name: Update Checker

on:
  schedule:
    - cron: '0 * * * *' # Every 1 hour
  workflow_dispatch: # Manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # some versions/configurations of GitHub CLI need PR permissions for release creation
    outputs:
      updated: ${{ steps.update_file.outputs.updated }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Upstream Versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ── Helper: curl with retries ────────────────────────────────────────────
          fetch_url() {
            local url="$1"
            local headers=("${@:2}")
            local curl_cmd=(curl -sf --connect-timeout 10 --retry 3 --retry-delay 5)
            
            for h in "${headers[@]}"; do
              curl_cmd+=(-H "$h")
            done
            
            "${curl_cmd[@]}" "$url"
          }

          # ── Helper: fetch from GitHub Releases ───────────────────────────────────
          get_github_release() {
            local repo="$1"
            local field="$2"
            local response
            
            response=$(fetch_url "https://api.github.com/repos/${repo}/releases" \
              "Authorization: Bearer ${GH_TOKEN}" \
              "Accept: application/vnd.github+json" \
              "X-GitHub-Api-Version: 2022-11-28") || return 1

            if ! echo "$response" | jq -e 'type == "array"' > /dev/null 2>&1; then
              return 1
            fi

            # 4-Layer stable-only filter
            echo "$response" | jq -r '
              map(select(
                .prerelease==false and
                .draft==false and
                (.tag_name | test("(?i)(alpha|beta|canary|debug|dev|devel|development|edge|experimental|insiders|next|nightly|pre[.\\-]|preview|rc|rh|snapshot|temp|test|tmp|unstable)") | not) and
                (.tag_name | test("^(v?\\d+([.\\-]\\d+)*|release-\\d+(\\.\\d+)*)$"))
              )) | .[0].'"${field}"' // ""'
          }

          # ── Helper: fetch from GitHub Tags (for repos without GitHub Releases) ──
          get_github_tag() {
            local repo="$1"
            local response
            
            response=$(fetch_url "https://api.github.com/repos/${repo}/tags?per_page=30" \
              "Authorization: Bearer ${GH_TOKEN}" \
              "Accept: application/vnd.github+json" \
              "X-GitHub-Api-Version: 2022-11-28") || return 1

            if ! echo "$response" | jq -e 'type == "array"' > /dev/null 2>&1; then
              return 1
            fi

            # Filter tags matching standard stable version schemes
            echo "$response" | jq -r '
              [ .[].name |
                select(
                  (test("(?i)(alpha|beta|canary|debug|dev|devel|development|edge|experimental|insiders|next|nightly|pre[.\\-]|preview|rc|rh|snapshot|temp|test|tmp|unstable)") | not) and
                  test("^(v?\\d+([.\\-]\\d+)*|release-\\d+(\\.\\d+)*)$")
                )
              ] | .[0] // ""'
          }

          # ── Helper: fetch commit date from GitHub Ref/Tag ────────────────────────
          get_github_commit_date() {
            local repo="$1"
            local ref="$2"
            local response
            
            response=$(fetch_url "https://api.github.com/repos/${repo}/commits/${ref}" \
              "Authorization: Bearer ${GH_TOKEN}" \
              "Accept: application/vnd.github+json" \
              "X-GitHub-Api-Version: 2022-11-28") || return 1

            echo "$response" | jq -r '.commit.committer.date // .commit.author.date // ""'
          }

          # ── Fallback: fetch from Docker Hub (for Pi-hole) ────────────────────────
          get_dockerhub_tag() {
            local repo="$1"
            local response
            
            response=$(fetch_url "https://registry.hub.docker.com/v2/repositories/${repo}/tags?page_size=50") || return 1
            
            # Extract tags that match our stable allowlist, exclude known junk, sort and take latest
            echo "$response" | jq -r '
              .results[].name | 
              select(
                test("^(v?\\d+([.\\-]\\d+)*)$") and 
                (test("(?i)(alpha|beta|canary|debug|dev|devel|development|edge|experimental|insiders|next|nightly|pre[.\\-]|preview|rc|rh|snapshot|temp|test|tmp|unstable)") | not)
              )' | sort -V | tail -n1
          }

          # ── Helper: Downgrade Guard ──────────────────────────────────────────────
          is_downgrade() {
            local current="$1"
            local new="$2"
            [ "$(printf '%s\n%s\n' "$current" "$new" | sort -V | head -n1)" = "$new" ] && [ "$current" != "$new" ]
          }

          # ── Execution ────────────────────────────────────────────────────────────
          
          # 1. Resolve Pi-hole
          PI_VERSION=$(get_github_release "pi-hole/docker-pi-hole" "tag_name" 2>/dev/null || true)
          if [ -z "$PI_VERSION" ]; then
            PI_VERSION=$(get_dockerhub_tag "pihole/pihole" 2>/dev/null || true)
          fi

          PI_DATE=$(get_github_release "pi-hole/docker-pi-hole" "published_at" 2>/dev/null || true)
          if [ -z "$PI_DATE" ] && [ -n "$PI_VERSION" ]; then
            PI_DATE=$(get_github_commit_date "pi-hole/docker-pi-hole" "$PI_VERSION" 2>/dev/null || true)
          fi
          if [ -z "$PI_DATE" ]; then
            PI_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          
          # 2. Resolve Unbound
          UNBOUND_VERSION=$(get_github_release "NLnetLabs/unbound" "tag_name" 2>/dev/null || true)
          if [ -z "$UNBOUND_VERSION" ]; then
            UNBOUND_VERSION=$(get_github_tag "NLnetLabs/unbound" 2>/dev/null || true)
          fi

          UNBOUND_DATE=$(get_github_release "NLnetLabs/unbound" "published_at" 2>/dev/null || true)
          if [ -z "$UNBOUND_DATE" ] && [ -n "$UNBOUND_VERSION" ]; then
            UNBOUND_DATE=$(get_github_commit_date "NLnetLabs/unbound" "$UNBOUND_VERSION" 2>/dev/null || true)
          fi
          if [ -z "$UNBOUND_DATE" ]; then
            UNBOUND_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi

          echo "Pi-hole candidate  : ${PI_VERSION:-<unknown>} (${PI_DATE:-?})"
          echo "Unbound candidate  : ${UNBOUND_VERSION:-<unknown>} (${UNBOUND_DATE:-?})"

          # Check against current
          CURR_PI=$(grep PIHOLE_VERSION VERSION | cut -d'=' -f2 || echo "0.0.0")
          CURR_UNBOUND=$(grep UNBOUND_VERSION VERSION | cut -d'=' -f2 || echo "0.0.0")

          # Bail if resolution failed
          if [ -z "$PI_VERSION" ] || [ -z "$UNBOUND_VERSION" ]; then
            echo "::warning::Resolution failed; skipping."
            echo "stable=skip" >> "$GITHUB_OUTPUT"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Downgrade guard
          if is_downgrade "$CURR_PI" "$PI_VERSION"; then
            echo "::warning::Pi-hole resolved to an older version ($PI_VERSION < $CURR_PI); guarding against downgrade."
            PI_VERSION="$CURR_PI"
          fi
          if is_downgrade "$CURR_UNBOUND" "$UNBOUND_VERSION"; then
            echo "::warning::Unbound resolved to an older version ($UNBOUND_VERSION < $CURR_UNBOUND); guarding against downgrade."
            UNBOUND_VERSION="$CURR_UNBOUND"
          fi

          # 3-Day Buffer check
          THRESHOLD=259200
          NOW=$(date -u +%s)

          PI_STABLE=true
          if [ "$PI_VERSION" != "$CURR_PI" ]; then
            PI_AGE=$(( NOW - $(date -d "$PI_DATE" +%s 2>/dev/null || echo "$NOW") ))
            if [ "$PI_AGE" -lt "$THRESHOLD" ]; then
              PI_STABLE=false
              echo "::notice::Pi-hole version $PI_VERSION is too new (age $((PI_AGE/3600))h < 72h)"
            fi
          fi

          UNBOUND_STABLE=true
          if [ "$UNBOUND_VERSION" != "$CURR_UNBOUND" ]; then
            UNBOUND_AGE=$(( NOW - $(date -d "$UNBOUND_DATE" +%s 2>/dev/null || echo "$NOW") ))
            if [ "$UNBOUND_AGE" -lt "$THRESHOLD" ]; then
              UNBOUND_STABLE=false
              echo "::notice::Unbound version $UNBOUND_VERSION is too new (age $((UNBOUND_AGE/3600))h < 72h)"
            fi
          fi

          echo "latest_pi=$PI_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_unbound=$UNBOUND_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$PI_STABLE" = "true" ] && [ "$UNBOUND_STABLE" = "true" ]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "pending=true" >> "$GITHUB_OUTPUT"
            
            # Generate PENDING_RELEASES.md content
            {
              echo "# Pending Releases (72-Hour Cooling Buffer)"
              echo ""
              echo "The following upstream release(s) have been detected but are currently undergoing mandatory 72-hour community testing before automated container builds trigger:"
              echo ""
              echo "| Component | Target Version | Upstream Released | Current Age | Status |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              if [ "$PI_STABLE" = "false" ]; then
                PI_REM=$(( (THRESHOLD - PI_AGE) / 3600 ))
                echo "| Pi-hole | \`$PI_VERSION\` | $PI_DATE | $((PI_AGE/3600))h | ⏳ Cooling down (~${PI_REM}h remaining) |"
              fi
              if [ "$UNBOUND_STABLE" = "false" ]; then
                UNBOUND_REM=$(( (THRESHOLD - UNBOUND_AGE) / 3600 ))
                echo "| Unbound | \`$UNBOUND_VERSION\` | $UNBOUND_DATE | $((UNBOUND_AGE/3600))h | ⏳ Cooling down (~${UNBOUND_REM}h remaining) |"
              fi
              echo ""
              echo "_Last checked: $(date -u '+%Y-%m-%d %H:%M:%S UTC')_"
            } > PENDING_RELEASES.md
          fi

      - name: Update Pending Status File
        if: steps.check.outputs.pending == 'true'
        run: |
          if [ -f PENDING_RELEASES.md ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add PENDING_RELEASES.md
            if ! git diff --cached --quiet; then
              git pull --rebase origin master || true
              git commit -m "docs: update PENDING_RELEASES.md status"
              git push
            fi
          fi

      - name: Update Version File
        id: update_file
        if: steps.check.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PI_VER="${{ steps.check.outputs.latest_pi }}"
          UNBOUND_VER="${{ steps.check.outputs.latest_unbound }}"
          echo "PIHOLE_VERSION=$PI_VER" > VERSION
          echo "UNBOUND_VERSION=$UNBOUND_VER" >> VERSION

          # Remove PENDING_RELEASES.md once release is promoted
          rm -f PENDING_RELEASES.md

          if git diff --quiet VERSION; then
            echo "Versions are already current."
            echo "updated=false" >> "$GITHUB_OUTPUT"

            # Clean up pending file if it was still tracked in git
            if [ -n "$(git status --porcelain PENDING_RELEASES.md 2>/dev/null)" ]; then
              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"
              git rm --ignore-unmatch PENDING_RELEASES.md
              git pull --rebase origin master || true
              git commit -m "docs: remove resolved PENDING_RELEASES.md"
              git push
            fi
          else
            UNBOUND_VER_CLEAN=$(echo "$UNBOUND_VER" | sed 's/^release-//')
            TAG_NAME="${PI_VER}-${UNBOUND_VER_CLEAN}"

            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add VERSION
            git rm --ignore-unmatch PENDING_RELEASES.md
            git pull --rebase origin master || true
            git commit -m "chore: update upstream versions to Pi-hole $PI_VER and Unbound $UNBOUND_VER"
            git push

            # Create and push Git Tag
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"

            # Create GitHub Release with direct upstream release links
            RELEASE_NOTES=$(printf "### Upstream Release Information\n\n- **Pi-hole (docker-pi-hole)**: [Release %s](https://github.com/pi-hole/docker-pi-hole/releases/tag/%s)\n- **Unbound**: [Release %s](https://github.com/NLnetLabs/unbound/releases/tag/%s)" "$PI_VER" "$PI_VER" "$UNBOUND_VER" "$UNBOUND_VER")

            gh release create "$TAG_NAME" --title "Release $TAG_NAME" --notes "$RELEASE_NOTES"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: check-versions
    if: needs.check-versions.outputs.updated == 'true'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
