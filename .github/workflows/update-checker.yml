name: Update Checker

on:
  schedule:
    - cron: '0 * * * *' # Every 1 hour
  workflow_dispatch: # Manual trigger
    inputs:
      force_immediate:
        description: 'Bypass cooling buffer and promote immediately'
        required: false
        type: boolean
        default: false
      override_buffer_hours:
        description: 'Override cooling buffer in hours (0 = use adaptive)'
        required: false
        type: number
        default: 0

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # some versions/configurations of GitHub CLI need PR permissions for release creation
    outputs:
      updated: ${{ steps.update_file.outputs.updated }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Upstream Versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_IMMEDIATE: ${{ inputs.force_immediate || 'false' }}
          OVERRIDE_BUFFER_HOURS: ${{ inputs.override_buffer_hours || 0 }}
        run: |
          set -euo pipefail

          # ── Helper: curl with retries ────────────────────────────────────────────
          fetch_url() {
            local url="$1"
            local headers=("${@:2}")
            local curl_cmd=(curl -sf --connect-timeout 10 --retry 3 --retry-delay 5)
            
            for h in "${headers[@]}"; do
              curl_cmd+=(-H "$h")
            done
            
            "${curl_cmd[@]}" "$url"
          }

          # ── Helper: fetch from GitHub Releases ───────────────────────────────────
          get_github_release() {
            local repo="$1"
            local field="$2"
            local response
            
            response=$(fetch_url "https://api.github.com/repos/${repo}/releases" \
              "Authorization: Bearer ${GH_TOKEN}" \
              "Accept: application/vnd.github+json" \
              "X-GitHub-Api-Version: 2022-11-28") || return 1

            if ! echo "$response" | jq -e 'type == "array"' > /dev/null 2>&1; then
              return 1
            fi

            # 4-Layer stable-only filter
            echo "$response" | jq -r '
              map(select(
                .prerelease==false and
                .draft==false and
                (.tag_name | test("(?i)(alpha|beta|canary|debug|dev|devel|development|edge|experimental|insiders|next|nightly|pre[.\\-]|preview|rc|rh|snapshot|temp|test|tmp|unstable)") | not) and
                (.tag_name | test("^(v?\\d+([.\\-]\\d+)*|release-\\d+(\\.\\d+)*)$"))
              )) | .[0].'"${field}"' // ""'
          }

          # ── Helper: fetch from GitHub Tags (for repos without GitHub Releases) ──
          get_github_tag() {
            local repo="$1"
            local response
            
            response=$(fetch_url "https://api.github.com/repos/${repo}/tags?per_page=30" \
              "Authorization: Bearer ${GH_TOKEN}" \
              "Accept: application/vnd.github+json" \
              "X-GitHub-Api-Version: 2022-11-28") || return 1

            if ! echo "$response" | jq -e 'type == "array"' > /dev/null 2>&1; then
              return 1
            fi

            # Filter tags matching standard stable version schemes
            echo "$response" | jq -r '
              [ .[].name |
                select(
                  (test("(?i)(alpha|beta|canary|debug|dev|devel|development|edge|experimental|insiders|next|nightly|pre[.\\-]|preview|rc|rh|snapshot|temp|test|tmp|unstable)") | not) and
                  test("^(v?\\d+([.\\-]\\d+)*|release-\\d+(\\.\\d+)*)$")
                )
              ] | .[0] // ""'
          }

          # ── Helper: fetch commit date from GitHub Ref/Tag ────────────────────────
          get_github_commit_date() {
            local repo="$1"
            local ref="$2"
            local response
            
            response=$(fetch_url "https://api.github.com/repos/${repo}/commits/${ref}" \
              "Authorization: Bearer ${GH_TOKEN}" \
              "Accept: application/vnd.github+json" \
              "X-GitHub-Api-Version: 2022-11-28") || return 1

            echo "$response" | jq -r '.commit.committer.date // .commit.author.date // ""'
          }

          # ── Helper: fetch commit message from GitHub Ref/Tag ─────────────────────
          get_github_commit_message() {
            local repo="$1"
            local ref="$2"
            local response
            
            response=$(fetch_url "https://api.github.com/repos/${repo}/commits/${ref}" \
              "Authorization: Bearer ${GH_TOKEN}" \
              "Accept: application/vnd.github+json" \
              "X-GitHub-Api-Version: 2022-11-28") || return 1

            echo "$response" | jq -r '.commit.message // ""'
          }

          # ── Fallback: fetch from Docker Hub (for Pi-hole) ────────────────────────
          get_dockerhub_tag() {
            local repo="$1"
            local response
            
            response=$(fetch_url "https://registry.hub.docker.com/v2/repositories/${repo}/tags?page_size=50") || return 1
            
            # Extract tags that match our stable allowlist, exclude known junk, sort and take latest
            echo "$response" | jq -r '
              .results[].name | 
              select(
                test("^(v?\\d+([.\\-]\\d+)*)$") and 
                (test("(?i)(alpha|beta|canary|debug|dev|devel|development|edge|experimental|insiders|next|nightly|pre[.\\-]|preview|rc|rh|snapshot|temp|test|tmp|unstable)") | not)
              )' | sort -V | tail -n1
          }

          # ── Helper: Downgrade Guard ──────────────────────────────────────────────
          is_downgrade() {
            local current="$1"
            local new="$2"
            [ "$(printf '%s\n%s\n' "$current" "$new" | sort -V | head -n1)" = "$new" ] && [ "$current" != "$new" ]
          }

          # ── Helper: Security Severity Classifier ─────────────────────────────────
          is_security_release() {
            local text="$1"
            echo "$text" | grep -Eiq "CVE-[0-9]{4}-[0-9]+|\b(critical|high)[ -]severit|severity:\s*(critical|high)|\brce\b|remote[ -]code[ -]execution|denial[ -]of[ -]service|\bDoS\b|dnssec[ -]bypass|cache[ -]poisoning|\bpoisoning\b|\bspoofing\b|buffer[ -]overflow|memory[ -]corruption|privilege[ -]escalation|arbitrary[ -]code|vulnerabilit(y|ies)|security[ -](patch|fix|update|advisory|issue)|zero-day|0-day"
          }

          extract_security_reason() {
            local text="$1"
            local cve
            cve=$(echo "$text" | grep -Eio "CVE-[0-9]{4}-[0-9]+" || true)
            cve=$(echo "$cve" | sed -n '1p')
            if [ -n "$cve" ]; then
              echo "CVE detected: $(echo "$cve" | tr '[:lower:]' '[:upper:]')"
              return
            fi
            local kw
            kw=$(echo "$text" | grep -Eio "\b(critical|high)[ -]severit|\brce\b|remote[ -]code[ -]execution|denial[ -]of[ -]service|\bDoS\b|dnssec[ -]bypass|cache[ -]poisoning|\bpoisoning\b|\bspoofing\b|buffer[ -]overflow|memory[ -]corruption|privilege[ -]escalation|vulnerabilit[a-z]*|security[ -][a-z]+" || true)
            kw=$(echo "$kw" | sed -n '1p')
            if [ -n "$kw" ]; then
              echo "Security indicator: $kw"
              return
            fi
            echo "Security alert"
          }

          get_threshold_seconds() {
            local text="$1"
            local override_hours="${2:-0}"
            local force_immediate="${3:-false}"

            if [ "$force_immediate" = "true" ]; then
              echo 0
              return
            fi
            if [ "$override_hours" -gt 0 ] 2>/dev/null; then
              echo $(( override_hours * 3600 ))
              return
            fi
            if is_security_release "$text"; then
              echo 43200 # 12 hours
            else
              echo 86400 # 24 hours
            fi
          }

          # ── Execution ────────────────────────────────────────────────────────────
          
          # 1. Resolve Pi-hole
          PI_VERSION=$(get_github_release "pi-hole/docker-pi-hole" "tag_name" 2>/dev/null || true)
          if [ -z "$PI_VERSION" ]; then
            PI_VERSION=$(get_dockerhub_tag "pihole/pihole" 2>/dev/null || true)
          fi

          PI_DATE=$(get_github_release "pi-hole/docker-pi-hole" "published_at" 2>/dev/null || true)
          if [ -z "$PI_DATE" ] && [ -n "$PI_VERSION" ]; then
            PI_DATE=$(get_github_commit_date "pi-hole/docker-pi-hole" "$PI_VERSION" 2>/dev/null || true)
          fi
          if [ -z "$PI_DATE" ]; then
            PI_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi

          PI_BODY=$(get_github_release "pi-hole/docker-pi-hole" "body" 2>/dev/null || true)
          PI_NAME=$(get_github_release "pi-hole/docker-pi-hole" "name" 2>/dev/null || true)
          PI_TEXT="${PI_NAME} ${PI_BODY}"
          
          # 2. Resolve Unbound
          UNBOUND_VERSION=$(get_github_release "NLnetLabs/unbound" "tag_name" 2>/dev/null || true)
          if [ -z "$UNBOUND_VERSION" ]; then
            UNBOUND_VERSION=$(get_github_tag "NLnetLabs/unbound" 2>/dev/null || true)
          fi

          UNBOUND_DATE=$(get_github_release "NLnetLabs/unbound" "published_at" 2>/dev/null || true)
          if [ -z "$UNBOUND_DATE" ] && [ -n "$UNBOUND_VERSION" ]; then
            UNBOUND_DATE=$(get_github_commit_date "NLnetLabs/unbound" "$UNBOUND_VERSION" 2>/dev/null || true)
          fi
          if [ -z "$UNBOUND_DATE" ]; then
            UNBOUND_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi

          UNBOUND_MSG=$(get_github_commit_message "NLnetLabs/unbound" "$UNBOUND_VERSION" 2>/dev/null || true)
          UNBOUND_BODY=$(get_github_release "NLnetLabs/unbound" "body" 2>/dev/null || true)
          UNBOUND_TEXT="${UNBOUND_MSG} ${UNBOUND_BODY}"

          echo "Pi-hole candidate  : ${PI_VERSION:-<unknown>} (${PI_DATE:-?})"
          echo "Unbound candidate  : ${UNBOUND_VERSION:-<unknown>} (${UNBOUND_DATE:-?})"

          # Check against current
          CURR_PI=$(grep PIHOLE_VERSION VERSION | cut -d'=' -f2 || echo "0.0.0")
          CURR_UNBOUND=$(grep UNBOUND_VERSION VERSION | cut -d'=' -f2 || echo "0.0.0")

          # Bail if resolution failed
          if [ -z "$PI_VERSION" ] || [ -z "$UNBOUND_VERSION" ]; then
            echo "::warning::Resolution failed; skipping."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Downgrade guard
          if is_downgrade "$CURR_PI" "$PI_VERSION"; then
            echo "::warning::Pi-hole resolved to an older version ($PI_VERSION < $CURR_PI); guarding against downgrade."
            PI_VERSION="$CURR_PI"
          fi
          if is_downgrade "$CURR_UNBOUND" "$UNBOUND_VERSION"; then
            echo "::warning::Unbound resolved to an older version ($UNBOUND_VERSION < $CURR_UNBOUND); guarding against downgrade."
            UNBOUND_VERSION="$CURR_UNBOUND"
          fi

          # ── Adaptive Threshold & Decoupled Evaluation ────────────────────────────
          PI_THRESHOLD=$(get_threshold_seconds "$PI_TEXT" "$OVERRIDE_BUFFER_HOURS" "$FORCE_IMMEDIATE")
          if is_security_release "$PI_TEXT"; then
            PI_REASON="⚡ Security Fast-Track (12h): $(extract_security_reason "$PI_TEXT")"
          else
            PI_REASON="Standard Release (24h)"
          fi

          UNBOUND_THRESHOLD=$(get_threshold_seconds "$UNBOUND_TEXT" "$OVERRIDE_BUFFER_HOURS" "$FORCE_IMMEDIATE")
          if is_security_release "$UNBOUND_TEXT"; then
            UNBOUND_REASON="⚡ Security Fast-Track (12h): $(extract_security_reason "$UNBOUND_TEXT")"
          else
            UNBOUND_REASON="Standard Release (24h)"
          fi

          NOW=$(date -u +%s)

          PI_READY=true
          PI_IS_NEW=false
          PI_AGE=0
          TARGET_PI="$CURR_PI"

          if [ "$PI_VERSION" != "$CURR_PI" ]; then
            PI_IS_NEW=true
            PI_AGE=$(( NOW - $(date -d "$PI_DATE" +%s 2>/dev/null || echo "$NOW") ))
            if [ "$PI_AGE" -ge "$PI_THRESHOLD" ]; then
              PI_READY=true
              TARGET_PI="$PI_VERSION"
              echo "Pi-hole $PI_VERSION is ready (age $((PI_AGE/3600))h >= $((PI_THRESHOLD/3600))h) [$PI_REASON]"
            else
              PI_READY=false
              echo "::notice::Pi-hole $PI_VERSION is cooling (age $((PI_AGE/3600))h < $((PI_THRESHOLD/3600))h) [$PI_REASON]"
            fi
          fi

          UNBOUND_READY=true
          UNBOUND_IS_NEW=false
          UNBOUND_AGE=0
          TARGET_UNBOUND="$CURR_UNBOUND"

          if [ "$UNBOUND_VERSION" != "$CURR_UNBOUND" ]; then
            UNBOUND_IS_NEW=true
            UNBOUND_AGE=$(( NOW - $(date -d "$UNBOUND_DATE" +%s 2>/dev/null || echo "$NOW") ))
            if [ "$UNBOUND_AGE" -ge "$UNBOUND_THRESHOLD" ]; then
              UNBOUND_READY=true
              TARGET_UNBOUND="$UNBOUND_VERSION"
              echo "Unbound $UNBOUND_VERSION is ready (age $((UNBOUND_AGE/3600))h >= $((UNBOUND_THRESHOLD/3600))h) [$UNBOUND_REASON]"
            else
              UNBOUND_READY=false
              echo "::notice::Unbound $UNBOUND_VERSION is cooling (age $((UNBOUND_AGE/3600))h < $((UNBOUND_THRESHOLD/3600))h) [$UNBOUND_REASON]"
            fi
          fi

          echo "target_pi=$TARGET_PI" >> "$GITHUB_OUTPUT"
          echo "target_unbound=$TARGET_UNBOUND" >> "$GITHUB_OUTPUT"

          if [ "$TARGET_PI" != "$CURR_PI" ] || [ "$TARGET_UNBOUND" != "$CURR_UNBOUND" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

          HAS_PENDING=false
          if [ "$PI_IS_NEW" = "true" ] && [ "$PI_READY" = "false" ]; then
            HAS_PENDING=true
          fi
          if [ "$UNBOUND_IS_NEW" = "true" ] && [ "$UNBOUND_READY" = "false" ]; then
            HAS_PENDING=true
          fi
          echo "pending=$HAS_PENDING" >> "$GITHUB_OUTPUT"

          if [ "$HAS_PENDING" = "true" ]; then
            {
              echo "# Pending Releases (Adaptive Security Buffer)"
              echo ""
              echo "The following upstream release(s) have been detected and are currently cooling down before automated container builds trigger."
              echo ""
              echo "- **Standard Buffer**: 24 hours"
              echo "- **Security / CVE Fast-Track Buffer**: 12 hours"
              echo ""
              echo "| Component | Target Version | Upstream Released | Current Age | Policy / Buffer | Status |"
              echo "| :--- | :--- | :--- | :--- | :--- | :--- |"
              if [ "$PI_IS_NEW" = "true" ] && [ "$PI_READY" = "false" ]; then
                PI_REM=$(( (PI_THRESHOLD - PI_AGE) / 3600 ))
                [ "$PI_REM" -lt 1 ] && PI_REM="<1"
                echo "| Pi-hole | \`$PI_VERSION\` | $PI_DATE | $((PI_AGE/3600))h | $PI_REASON | ⏳ Cooling (~${PI_REM}h remaining) |"
              fi
              if [ "$UNBOUND_IS_NEW" = "true" ] && [ "$UNBOUND_READY" = "false" ]; then
                UNBOUND_REM=$(( (UNBOUND_THRESHOLD - UNBOUND_AGE) / 3600 ))
                [ "$UNBOUND_REM" -lt 1 ] && UNBOUND_REM="<1"
                echo "| Unbound | \`$UNBOUND_VERSION\` | $UNBOUND_DATE | $((UNBOUND_AGE/3600))h | $UNBOUND_REASON | ⏳ Cooling (~${UNBOUND_REM}h remaining) |"
              fi
              echo ""
              echo "_Last checked: $(date -u '+%Y-%m-%d %H:%M:%S UTC')_"
            } > PENDING_RELEASES.md
          fi

      - name: Verify and Refresh NTP Fallback IPs
        run: |
          CONF_FILE="docker/ntp-servers.conf"
          [ ! -f "$CONF_FILE" ] && exit 0

          TEMP_FILE=$(mktemp)
          echo "# Multi-Provider Anycast NTP Fallback IPs for Raspberry Pi / RTC Cold-Boot Recovery" > "$TEMP_FILE"
          echo "# Automatically maintained and verified by .github/workflows/update-checker.yml" >> "$TEMP_FILE"
          echo "# Format: PROVIDER|HOSTNAME|IPV4" >> "$TEMP_FILE"

          while IFS='|' read -r provider host current_ip || [ -n "$provider" ]; do
            [[ "$provider" =~ ^# ]] || [ -z "$provider" ] && continue
            new_ip=$(dig +short "$host" A 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            if [ -n "$new_ip" ]; then
              echo "${provider}|${host}|${new_ip}" >> "$TEMP_FILE"
            else
              echo "${provider}|${host}|${current_ip}" >> "$TEMP_FILE"
            fi
          done < "$CONF_FILE"

          mv "$TEMP_FILE" "$CONF_FILE"

          if ! git diff --quiet "$CONF_FILE"; then
            echo "NTP Fallback IPs updated from upstream DNS."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git pull --rebase origin master || true
            git add "$CONF_FILE"
            git commit -m "chore(ntp): update Anycast fallback NTP server IPs"
            git push origin master
          fi

      - name: Update Pending Status File
        if: steps.check.outputs.pending == 'true'
        run: |
          if [ -f PENDING_RELEASES.md ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git pull --rebase origin master || true
            git add PENDING_RELEASES.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: update PENDING_RELEASES.md status"
              git push
            fi
          fi

      - name: Update Version File
        id: update_file
        if: steps.check.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PI_VER="${{ steps.check.outputs.target_pi }}"
          UNBOUND_VER="${{ steps.check.outputs.target_unbound }}"
          echo "PIHOLE_VERSION=$PI_VER" > VERSION
          echo "UNBOUND_VERSION=$UNBOUND_VER" >> VERSION

          UNBOUND_VER_CLEAN=$(echo "$UNBOUND_VER" | sed 's/^release-//')
          TAG_NAME="${PI_VER}-${UNBOUND_VER_CLEAN}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin master || true
          git add VERSION

          # If nothing pending anymore, remove PENDING_RELEASES.md
          if [ "${{ steps.check.outputs.pending }}" != "true" ]; then
            rm -f PENDING_RELEASES.md
            git rm --ignore-unmatch PENDING_RELEASES.md 2>/dev/null || true
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: update upstream versions to Pi-hole $PI_VER and Unbound $UNBOUND_VER"
            git push

            # Create and push Git Tag
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"

            # Create GitHub Release with direct upstream release links
            RELEASE_NOTES=$(printf "### Upstream Release Information\n\n- **Pi-hole (docker-pi-hole)**: [Release %s](https://github.com/pi-hole/docker-pi-hole/releases/tag/%s)\n- **Unbound**: [Release %s](https://github.com/NLnetLabs/unbound/releases/tag/%s)" "$PI_VER" "$PI_VER" "$UNBOUND_VER" "$UNBOUND_VER")

            gh release create "$TAG_NAME" --title "Release $TAG_NAME" --notes "$RELEASE_NOTES"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: check-versions
    if: needs.check-versions.outputs.updated == 'true'
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
