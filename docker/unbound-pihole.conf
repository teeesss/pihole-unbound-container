# Config pulled from https://docs.pi-hole.net/guides/unbound/
# Enhanced with enabled root hints, RFC 8767 serve-expired, prefetch-key, and memory optimization

server:
    chroot: ""
    # Verbosity: 0 (errors only) for production stability
    verbosity: 0

    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # May be set to yes if you have native IPv6 connectivity
    do-ip6: no
    prefer-ip6: no

    # Root servers list (downloaded during build, refreshed on start)
    root-hints: "/var/lib/unbound/root.hints"

    # RFC 5011 DNSSEC root key auto-management
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Trust glue only if it is within the server's authority
    harden-glue: yes

    # Require DNSSEC data for trust-anchored zones
    harden-dnssec-stripped: yes

    # Don't use Capitalization randomization as it known to cause DNSSEC issues sometimes
    use-caps-for-id: no

    # Reduce EDNS reassembly buffer size
    edns-buffer-size: 1232

    # Perform prefetching of close-to-expired cache entries and DNSKEYs
    prefetch: yes
    prefetch-key: yes

    # RFC 8767: Serve expired cache responses when upstream/WAN is down or experiencing latency
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Memory and cache sizing (boosts cache hit ratio and prevents UDP packet drops)
    msg-cache-size: 64m
    rrset-cache-size: 128m
    so-rcvbuf: 4m
    so-sndbuf: 4m

    # Privacy & Security hardening
    hide-identity: yes
    hide-version: yes
    harden-below-nxdomain: yes
    qname-minimisation: yes

    # Threading (1 thread is optimal for Pi-hole container setups)
    num-threads: 1
    num-queries-per-thread: 4096

    # Access control (restrict recursion to local and Docker networks)
    access-control: 127.0.0.1/32 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    access-control: 0.0.0.0/0 refuse

    # Ensure privacy of local IP ranges (DNS rebinding protection)
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
